<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1620">
<meta name="robots" content="noindex">
<title>Code RED Ablage</title>
<style>
  html, body { margin: 0; height: 100%; background: #0E1620; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  /* nur genau über "‹ Dashboard" (Knopf 16 bis ca. 124 px), Drive beginnt ab ca. 129 bis 136 px */
  #zurueck { position: fixed; left: 0; top: 0; width: calc(env(safe-area-inset-left, 0px) + 108px); height: calc(env(safe-area-inset-top, 0px) + 50px); z-index: 10; background: transparent; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbxFRSbFBzR-_ineaVUoHUpHwWxD03JSjvI0-fosqkvVBFjYa0krCZo3i5e8ALtmWuEs/exec?v=hell&open=ablage" allow="clipboard-write"></iframe>
<button id="zurueck" type="button" aria-label="Zurück zu Code Red LIVE"></button>
<script>
  // Zurück zu Code Red LIVE. Das alte Dashboard unter der Ablage wird nie gezeigt.
  var LIVE = 'intent://zurueck#Intent;scheme=codered-live;package=de.hg.codered.live;end';
  document.getElementById('zurueck').addEventListener('click', function () {
    location.href = LIVE;
    setTimeout(function () {
      if (document.visibilityState === 'visible') { try { window.close(); } catch (e) {} }
    }, 1500);
  });
</script>
</body>
</html>
