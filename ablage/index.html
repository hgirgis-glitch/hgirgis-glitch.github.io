<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1620">
<meta name="robots" content="noindex">
<title>Code RED Ablage</title>
<style>
  html, body { margin: 0; height: 100%; background: #0E1620; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbxFRSbFBzR-_ineaVUoHUpHwWxD03JSjvI0-fosqkvVBFjYa0krCZo3i5e8ALtmWuEs/exec?v=hell&open=ablage" allow="clipboard-write"></iframe>
<script>
  // Der Knopf "Dashboard" in der Ablage meldet sich per Nachricht (Reiter Web, Zeile 571).
  // Dann geht es zurück zu Code Red LIVE statt zum Google Dashboard unter der Ablage.
  var LIVE = 'intent://zurueck#Intent;scheme=codered-live;package=de.hg.codered.live;end';
  window.addEventListener('message', function (e) {
    if (e.data !== 'cr-live-zurueck') return;
    if (!/(^https:\/\/script\.google\.com$)|(\.googleusercontent\.com$)/.test(e.origin)) return;
    location.href = LIVE;
  });
</script>
</body>
</html>
