<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6FB">
<meta name="robots" content="noindex">
<title>Code RED</title>
<style>
  html, body { margin: 0; height: 100%; background: #e9edf6; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #sk { position: fixed; inset: 0; z-index: 8; background: #e9edf6; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: opacity .25s; }
  #sk.x { opacity: 0; pointer-events: none; }
  #sk.snap { overflow: hidden; pointer-events: none; }
  #sk.snap .zstand b { display: none; }
  #sk .h { background: #fff; padding: 14px 16px 12px; box-shadow: 0 6px 18px -14px rgba(20,25,60,.3); display: flex; align-items: center; gap: 12px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
  #sk .l { font-weight: 900; font-size: 18px; color: #ec2b2b; display: flex; align-items: center; gap: 7px; letter-spacing: .01em; }
  #sk .p { width: 11px; height: 11px; border-radius: 50%; background: #ec2b2b; animation: pu 1.8s infinite; }
  @keyframes pu { 0% { box-shadow: 0 0 0 0 rgba(236,43,43,.5); } 70% { box-shadow: 0 0 0 8px rgba(236,43,43,0); } 100% { box-shadow: 0 0 0 0 rgba(236,43,43,0); } }
  #sk .t { margin-left: auto; font-size: 11px; color: #6f7591; }
  #sk .b { padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #sk .c { background: #fff; border-radius: 16px; height: 112px; position: relative; overflow: hidden; box-shadow: 0 1px 2px rgba(20,25,60,.05); }
  #sk .c.w { grid-column: 1 / -1; height: 150px; }
  #sk .c:after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, rgba(91,95,240,.08) 50%, transparent 80%); transform: translateX(-100%); animation: sh 1.4s infinite; }
  @keyframes sh { to { transform: translateX(100%); } }
  @media (prefers-reduced-motion: reduce) { #sk .p, #sk .c:after { animation: none; } }
  #ztm { position: fixed; left: 12px; right: 12px; bottom: 84px; z-index: 9; background: #1a1d2e; color: #fff; font: 600 12px/1.45 system-ui, sans-serif; padding: 9px 12px; border-radius: 10px; text-align: center; box-shadow: 0 8px 20px -8px rgba(0,0,0,.5); }
</style>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbxFRSbFBzR-_ineaVUoHUpHwWxD03JSjvI0-fosqkvVBFjYa0krCZo3i5e8ALtmWuEs/exec?v=hell" allow="clipboard-write"></iframe>
<div id="sk" aria-hidden="true"><div class="h"><div class="l"><span class="p"></span>CODE RED</div><div class="t">lädt …</div></div><div class="b"><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c w"></div></div></div>
<script>
(function () {
  var done = false, sk = document.getElementById('sk'), de = document.documentElement, snapped = false;
  function ok(e) { try { return /googleusercontent\.com$/.test(new URL(e.origin).hostname); } catch (x) { return false; } }
  // zuletzt gespeicherte Ansicht sofort zeigen, bis die echte Seite bereit ist
  try {
    var sn = JSON.parse(localStorage.getItem('zsnap') || 'null');
    if (sn && sn.html && Date.now() - sn.ts < 14 * 86400000) {
      var st = document.createElement('style'); st.textContent = sn.css || ''; document.head.appendChild(st);
      sk.innerHTML = sn.html; sk.className = 'snap';
      de.classList.add('hellui');
      if (localStorage.getItem('zpv') !== '0') de.classList.add('pv');
      var z = sk.querySelector('#zst'); if (z) z.textContent = (z.textContent || '').trim() + ' (gespeichert)';
      snapped = true;
    }
  } catch (x) {}
  function hide() { if (!sk.parentNode) return; sk.classList.add('x'); setTimeout(function () { if (sk.parentNode) sk.remove(); }, 400); }
  setTimeout(hide, snapped ? 25000 : 8000);
  function f(ms) { return (Math.max(0, ms) / 1000).toFixed(1).replace('.', ',') + ' s'; }
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !ok(e)) return;
    if (d.t === 'zsnap' && d.html) { try { localStorage.setItem('zsnap', JSON.stringify({ html: d.html, css: d.css, ts: d.ts })); } catch (x) {} return; }
    if (d.t === 'zpv') { try { localStorage.setItem('zpv', d.pv ? '1' : '0'); } catch (x) {} return; }
    if (done || d.t !== 'ztm') return;
    done = true;
    hide();
    var o = performance.timeOrigin, start = d.o - o, total = d.o + d.v - o;
    var s = 'Ladezeit ' + f(total) + ': Google ' + f(start) + ', Aufbau im Handy ' + f(d.v) + (snapped ? ' (gespeicherte Ansicht war sofort da)' : '');
    try { var h = JSON.parse(localStorage.getItem('ztm') || '[]'); h.unshift([Date.now(), Math.round(start), Math.round(d.v)]); localStorage.setItem('ztm', JSON.stringify(h.slice(0, 20))); } catch (x) {}
    var b = document.createElement('div'); b.id = 'ztm'; b.textContent = s;
    b.onclick = function () { b.remove(); };
    document.body.appendChild(b);
    setTimeout(function () { b.remove(); }, 9000);
  });
})();
</script>
</body>
</html>
